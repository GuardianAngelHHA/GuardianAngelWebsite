name: Deploy to GoDaddy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.GODADDY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GODADDY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy website files to cPanel
        env:
          DEPLOY_HOST: ${{ secrets.GODADDY_HOST }}
          DEPLOY_USER: ${{ secrets.GODADDY_USER }}
        run: |
          DEPLOY_PATH="/home/il9883llvayk/public_html"
          if [[ ! "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "The cPanel username contains unexpected characters."
            exit 1
          fi
          echo "Deploying website files to the verified cPanel web root."
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22 \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          while IFS= read -r -d '' file; do
            case "$file" in
              .htaccess|*.html|*.css|*.js|*.php|*.pdf|*.png|*.ico|assets/*|Forms/*) ;;
              *) continue ;;
            esac
            remote_dir="$DEPLOY_PATH/$(dirname "$file")"
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22 \
              "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote_dir'"
            echo "Uploading $file"
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22 \
              "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/$file'" < "$file"
          done < <(git ls-files -z)
          for file in employee-forms.html employee-forms.js employee-forms.css; do
            expected_hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            actual_hash="$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22 \
              "$DEPLOY_USER@$DEPLOY_HOST" "sha256sum '$DEPLOY_PATH/$file' | cut -d ' ' -f 1")"
            if [[ "$expected_hash" != "$actual_hash" ]]; then
              echo "Uploaded file does not match the repository copy: $file (expected $expected_hash, found $actual_hash)"
              ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22 \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "hostname -f; id -un; printf 'SSH home: %s\\n' \"\$HOME\"; printf 'Working directory: %s\\n' \"\$PWD\"; stat -c '%n %s bytes %y' '$DEPLOY_PATH/employee-forms.html'; find \"\$HOME\" -maxdepth 6 -type f -name 'employee-forms.html' -print 2>/dev/null"
              exit 1
            fi
            echo "Verified uploaded file: $file"
          done
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$DEPLOY_PATH/employee-forms.html' && test -f '$DEPLOY_PATH/onboarding-submit.php'"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "https://www.guardianangelcareohio.com/employee-forms.html?deploy=$GITHUB_SHA" |
            grep -F 'Download completed W-4 PDF' > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "https://www.guardianangelcareohio.com/employee-forms.js?deploy=$GITHUB_SHA" |
            grep -F 'function makeI9' > /dev/null
          echo "Verified the public employee forms page."
